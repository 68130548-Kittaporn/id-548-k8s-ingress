apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-about
  namespace: id-548
  labels: { app: app-about }
spec:
  replicas: 2
  selector:
    matchLabels: { app: app-about }
  template:
    metadata:
      labels: { app: app-about }
    spec:
      containers:
        - name: app-about
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PHOTO_DIR
              value: /photo
          envFrom:
            - configMapRef:
                name: student-info
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: photo
              mountPath: /photo
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: code
          configMap:
            name: app-about-code     # generated by kustomization.yaml from apps/app-about/app.py
        - name: photo
          configMap:
            name: app-about-photo    # generated from apps/app-about/photo.*
---
apiVersion: v1
kind: Service
metadata:
  name: app-about
  namespace: id-548
  labels: { app: app-about }
spec:
  type: ClusterIP
  selector: { app: app-about }
  ports:
    - name: http
      port: 80
      targetPort: http
